<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlueGreen Guide | Phase 1 Outdoor Water Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Launch point filters and results">
        <header class="brand">
          <img
            src="assets/brand/bluegreen-guide-logo-primary-transparent.png"
            alt="BlueGreen Guide"
            style="display:block;width:68px;height:auto;background:transparent;border-radius:0;"
          >
          <div>
            <h1>BlueGreen Guide</h1>
            <p>Blue-space launch map</p>
            <a href="docs/" style="display:inline-block;margin-top:6px;color:#0f4f67;font-size:13px;font-weight:800;text-decoration:none;">Documentation</a>
          </div>
        </header>

        <section class="controls" aria-label="Search launch points">
          <label class="field field-full">
            <span>Search Blue Spaces</span>
            <input id="searchInput" type="search" placeholder="Try Newport, Tahoe, beginner, rentals..." />
          </label>

          <label class="field">
            <span>Region</span>
            <select id="regionFilter">
              <option value="all">All</option>
            </select>
          </label>

          <label class="field">
            <span>Skill</span>
            <select id="skillFilter">
              <option value="all">All</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </label>

          <label class="field">
            <span>Activity</span>
            <select id="activityFilter">
              <option value="all">All</option>
              <option value="SUP">SUP</option>
              <option value="Kayak">Kayak</option>
              <option value="Canoe">Canoe</option>
            </select>
          </label>

          <label class="field">
            <span>Max Difficulty</span>
            <select id="difficultyFilter">
              <option value="all">Any</option>
              <option value="1">1 - Very easy</option>
              <option value="2">2 - Easy</option>
              <option value="3">3 - Moderate</option>
              <option value="4">4 - Challenging</option>
              <option value="5">5 - Advanced</option>
            </select>
          </label>

          <button id="locationButton" class="button button-primary" type="button">Use my location</button>
          <button id="fitButton" class="button button-primary" type="button">Fit all</button>
          <button id="boundsButton" class="button button-secondary button-wide" type="button">
            Show launch points in current map view
          </button>
        </section>

        <section class="result-summary" aria-live="polite">
          <strong id="resultCount">0</strong>
          <span>launch points shown</span>
        </section>

        <section id="resultsList" class="results" aria-label="Launch point results"></section>
      </aside>

      <section class="map-panel" aria-label="Interactive map">
        <div id="map" class="map"></div>
      </section>

      <section id="detailPanel" class="detail-panel" aria-label="Launch point details" hidden></section>
    </main>

    <template id="launchCardTemplate">
      <article class="launch-card">
        <div class="launch-image" aria-hidden="true">
          <span class="photo-badge"></span>
        </div>
        <div class="launch-body">
          <div class="launch-heading">
            <h2></h2>
            <span class="pill"></span>
          </div>
          <p class="launch-meta"></p>
          <p class="verification-line"></p>
          <div class="rating-row"></div>
          <p class="launch-description"></p>
          <div class="tag-row"></div>
          <button class="card-button" type="button">View details</button>
        </div>
      </article>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="data/launch-points.js"></script>
    <script src="app.js"></script>
  </body>
</html>
