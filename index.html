<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BlueGreen Guide helps people discover practical outdoor experiences across blue spaces and green spaces."
    />
    <title>BlueGreen Guide | Discover Better Outdoors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="phase-1-expansion.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Place filters and results">
        <header class="brand">
          <a class="brand-lockup" href="./" aria-label="BlueGreen Guide home">
            <svg class="brand-landscape-mark" viewBox="0 0 72 92" role="img" aria-labelledby="brandMarkTitle">
              <title id="brandMarkTitle">BlueGreen Guide landscape mark</title>
              <rect class="brand-mark-frame" x="3" y="3" width="66" height="86" rx="19" />
              <path class="brand-mark-mountain-back" d="M12 52 29 29l10 13 8-10 14 20Z" />
              <path class="brand-mark-mountain-front" d="M9 55 27 38l12 14 9-8 15 11Z" />
              <path class="brand-mark-land" d="M7 58c12-7 22-7 31-2 9 5 18 5 27-1v12H7Z" />
              <path class="brand-mark-water" d="M7 66c10-4 20-4 30 0 10 4 19 4 28 0v19H7Z" />
              <path class="brand-mark-wave" d="M11 72c9-4 17-4 25 0 8 4 16 4 25 0" />
            </svg>
            <span class="brand-wordmark">
              <strong>BlueGreen Guide</strong>
              <span>Discover Better Outdoors</span>
            </span>
          </a>
          <a class="documentation-link" href="docs/">Documentation</a>
        </header>

        <section class="wayfinding-key" aria-labelledby="wayfindingTitle">
          <div>
            <p class="eyebrow">Wayfinding System</p>
            <h2 id="wayfindingTitle">Find the right outdoor experience</h2>
          </div>
          <div class="wayfinding-items" aria-label="Wayfinding categories">
            <span class="wayfinding-item wayfinding-water"><span aria-hidden="true">≈</span> Water</span>
            <span class="wayfinding-item wayfinding-land"><span aria-hidden="true">⌁</span> Land</span>
            <span class="wayfinding-item wayfinding-neutral"><span aria-hidden="true">＋</span> Amenities</span>
          </div>
        </section>

        <section class="collections-panel" aria-labelledby="collectionsTitle">
          <div class="collections-heading">
            <div>
              <p class="eyebrow">Curated Collections</p>
              <h2 id="collectionsTitle">Start with a helpful shortlist</h2>
            </div>
            <button id="clearCollectionButton" class="collection-clear" type="button" hidden>Clear</button>
          </div>
          <div id="collectionsList" class="collections-list"></div>
          <p id="collectionDescription" class="collection-description" aria-live="polite">
            Choose a collection to filter the current launch map.
          </p>
        </section>

        <section class="controls" aria-label="Search launch points">
          <label class="field field-full">
            <span>Search Places</span>
            <input id="searchInput" type="search" placeholder="Try Newport, Tahoe, beginner, rentals..." />
          </label>

          <label class="field">
            <span>Region</span>
            <select id="regionFilter">
              <option value="all">All</option>
            </select>
          </label>

          <label class="field">
            <span>Skill</span>
            <select id="skillFilter">
              <option value="all">All</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </label>

          <label class="field">
            <span>Water Activity</span>
            <select id="activityFilter">
              <option value="all">All</option>
              <option value="SUP">SUP</option>
              <option value="Kayak">Kayak</option>
              <option value="Canoe">Canoe</option>
            </select>
          </label>

          <label class="field">
            <span>Max Difficulty</span>
            <select id="difficultyFilter">
              <option value="all">Any</option>
              <option value="1">1 - Very easy</option>
              <option value="2">2 - Easy</option>
              <option value="3">3 - Moderate</option>
              <option value="4">4 - Challenging</option>
              <option value="5">5 - Advanced</option>
            </select>
          </label>

          <button id="locationButton" class="button button-primary" type="button">Use my location</button>
          <button id="fitButton" class="button button-secondary" type="button">Fit all places</button>
          <button id="boundsButton" class="button button-tertiary button-wide" type="button">
            Show places in current map view
          </button>
        </section>

        <section class="result-summary" aria-live="polite">
          <strong id="resultCount">0</strong>
          <span>launch points shown</span>
        </section>

        <section id="resultsList" class="results" aria-label="Launch point results"></section>
      </aside>

      <section class="map-panel" aria-label="Interactive map">
        <div class="map-label" aria-hidden="true">
          <span class="map-label-dot"></span>
          Curated launch map
        </div>
        <div id="map" class="map"></div>
      </section>

      <section id="detailPanel" class="detail-panel" aria-label="Launch point details" hidden></section>
    </main>

    <template id="launchCardTemplate">
      <article class="launch-card">
        <div class="launch-image" aria-hidden="true">
          <span class="photo-badge"></span>
        </div>
        <div class="launch-body">
          <div class="launch-heading">
            <h2></h2>
            <span class="pill"></span>
          </div>
          <p class="launch-meta"></p>
          <p class="verification-line"></p>
          <div class="rating-row"></div>
          <p class="launch-description"></p>
          <div class="tag-row"></div>
          <button class="card-button" type="button">View place details</button>
        </div>
      </article>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="data/launch-points.js"></script>
    <script src="data/phase-1-expansion.js"></script>
    <script src="app.js"></script>
    <script src="collections-ui.js"></script>
  </body>
</html>
