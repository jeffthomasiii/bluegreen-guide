name: Publish Phase 1 Closeout

on:
  push:
    branches: [main]
    paths:
      - .github/phase-1-closeout-trigger

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consolidate canonical data
        run: node scripts/consolidate-launch-data.js

      - name: Validate final repository state
        run: node scripts/validate-repo.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit consolidated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes were required."
          else
            git commit -m "Consolidate Phase 1 canonical data"
            git push origin HEAD:main
          fi

      - name: Publish v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists."
          else
            gh release create v1.1.0 \
              --target "$(git rev-parse HEAD)" \
              --title "BlueGreen Guide v1.1.0 — Phase 1 Closeout" \
              --notes-file docs/release-notes.md
          fi
